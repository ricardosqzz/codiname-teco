<text x="1945" y="443" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">Vias mapeadas</text>
<text x="1945" y="483" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Recortar e somar comprimentos</text>
<text x="1945" y="516" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Comprimento / área do suporte</text>
<text x="1945" y="549" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">ROAD_DENS • km/km²</text>
