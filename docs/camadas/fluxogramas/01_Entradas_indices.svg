<text x="550" y="443" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">IBGE • Esgotamento 2022</text>
<text x="550" y="483" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Rede geral/pluvial + fossa ligada</text>
<text x="550" y="516" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Percentual e densidade sem rede</text>
<text x="550" y="549" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">SEM_REDE / SEWER_DENS</text>
