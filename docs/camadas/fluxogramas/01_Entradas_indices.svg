<rect x="990" y="400" width="8" height="205" rx="3" fill="#23769a" stroke="none" stroke-width="2"/>
<text x="1015" y="443" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">CNES + SIH/SUS</text>
<text x="1015" y="483" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Localizar unidades e conferir atividade</text>
<text x="1015" y="516" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Média anual • 2016–2025</text>
<text x="1015" y="549" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">AIH_LOCAL • todas as causas</text>
