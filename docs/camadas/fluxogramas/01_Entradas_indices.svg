<rect x="60" y="1255" width="8" height="225" rx="3" fill="#257b6c" stroke="none" stroke-width="2"/>
<text x="85" y="1298" font-family="Arial" font-size="28" font-weight="700" fill="#257b6c">Índice multicritério</text>
<text x="85" y="1338" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Média ponderada das entradas</text>
<text x="85" y="1371" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Escore de 0 a 100</text>
<text x="85" y="1404" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Cinco classes fixas e quintis</text>
<text x="85" y="1437" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Índice S0 alimenta o Moran</text>
<rect x="650" y="1255" width="510" height="225" rx="16" fill="#ffffff" stroke="#cbd9df" stroke-width="2"/>
<rect x="650" y="1255" width="8" height="225" rx="3" fill="#78569a" stroke="none" stroke-width="2"/>
<text x="675" y="1298" font-family="Arial" font-size="28" font-weight="700" fill="#78569a">Moran global e local</text>
<text x="675" y="1338" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Entrada: escore S0 e vizinhança</text>
<text x="675" y="1371" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">ARG: Queen • MP: 8 vizinhos</text>
<text x="675" y="1404" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">999 permutações + FDR de 5%</text>
<text x="675" y="1437" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">HH / LL / HL / LH / não significativo</text>
<rect x="1240" y="1255" width="510" height="225" rx="16" fill="#ffffff" stroke="#cbd9df" stroke-width="2"/>
<rect x="1240" y="1255" width="8" height="225" rx="3" fill="#23769a" stroke="none" stroke-width="2"/>
<text x="1265" y="1298" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">K-means</text>
<text x="1265" y="1338" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Entrada: matriz normalizada</text>
<text x="1265" y="1371" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Pesos aplicados às variáveis</text>
<text x="1265" y="1404" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Testar K e comparar silhueta</text>
<text x="1265" y="1437" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Saída: perfis multivariados</text>
<rect x="1830" y="1255" width="510" height="225" rx="16" fill="#ffffff" stroke="#cbd9df" stroke-width="2"/>
<rect x="1830" y="1255" width="8" height="225" rx="3" fill="#b87825" stroke="none" stroke-width="2"/>
<text x="1855" y="1298" font-family="Arial" font-size="28" font-weight="700" fill="#b87825">Sensibilidade dos pesos</text>
<text x="1855" y="1338" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Comparar S0 e cenários S1–S4</text>
<text x="1855" y="1371" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Recalcular escores e grupos</text>
<text x="1855" y="1404" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Concordância / estabilidade</text>
<text x="1855" y="1437" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Não representa probabilidade</text>
