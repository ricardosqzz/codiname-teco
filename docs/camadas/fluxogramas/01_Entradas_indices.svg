<text x="85" y="708" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">4  Agregação no mesmo suporte</text>
<text x="85" y="748" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">Contagens, percentuais e comprimentos nos círculos de 500 m • cobertura e lacunas identificadas • círculos sobrepostos não são somados</text>
<polyline points="2340,250 2370,250 2370,727 2340,727" fill="none" stroke="#23769a" stroke-width="3.2" stroke-linejoin="round"/>
<polygon points="2340,727 2355.0,733.0 2355.0,721.0" fill="#23769a"/>
<rect x="250" y="870" width="840" height="250" rx="16" fill="#ffffff" stroke="#cbd9df" stroke-width="2"/>
<rect x="250" y="870" width="8" height="250" rx="3" fill="#257b6c" stroke="none" stroke-width="2"/>
<text x="275" y="913" font-family="Arial" font-size="28" font-weight="700" fill="#257b6c">5A  Pressão associada à resistência</text>
<text x="275" y="953" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">POP_DENS → ln(1 + x)</text>
<text x="275" y="986" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">SEM_REDE → percentual, sem logaritmo</text>
<text x="275" y="1019" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">AIH_LOCAL → ln(1 + x)</text>
<text x="275" y="1052" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">Min-max entre unidades elegíveis • S0: pesos 1, 1, 1</text>
<text x="275" y="1085" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">Internações são atividade hospitalar, não genes medidos.</text>
<rect x="1310" y="870" width="840" height="250" rx="16" fill="#ffffff" stroke="#cbd9df" stroke-width="2"/>
<rect x="1310" y="870" width="8" height="250" rx="3" fill="#23769a" stroke="none" stroke-width="2"/>
<text x="1335" y="913" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">5B  Pressão potencial de microplásticos</text>
<text x="1335" y="953" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">POP_DENS + SEWER_DENS</text>
<text x="1335" y="986" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">WASTE_DENS + ROAD_DENS</text>
<text x="1335" y="1019" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">Todas passam por ln(1 + x) e min-max</text>
<text x="1335" y="1052" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">S0: pesos 1, 1, 1, 1</text>
<text x="1335" y="1085" font-family="Arial" font-size="24" font-weight="400" fill="#17384b">Densidades são indicadores, não massas de microplásticos.</text>
