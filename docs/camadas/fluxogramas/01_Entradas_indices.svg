<text x="1480" y="443" font-family="Arial" font-size="28" font-weight="700" fill="#23769a">IBGE • Destinação do lixo</text>
<text x="1480" y="483" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Coleta e demais destinações</text>
<text x="1480" y="516" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">Preservar sigilo e hipóteses</text>
<text x="1480" y="549" font-family="Arial" font-size="22" font-weight="400" fill="#17384b">WASTE_DENS • domicílios/km²</text>
